# CI (wiki/code_quality.md Q1, Q2, Q8): compile, Prettier, lint ratchet, unit tests. Game data is not in the
# repository, so the browser parity test (npm run parity) runs locally only.
name: CI

on:
    push:
    pull_request:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 22
                  cache: npm
            - run: npm ci
            - name: TypeScript (0 errors)
              run: npm run build
            - name: Import cycle ratchet (largest cycle, tools/importCycles.mjs)
              run: node tools/importCycles.mjs --max 90
            - name: Prettier (npm run format to fix)
              run: npm run format:check
            - name: ESLint ratchet (tools/eslintBaseline.json)
              run: npm run lint:ratchet
            - name: Unit tests (test/*.test.mjs; pretest rebuilds js/)
              run: npm test
